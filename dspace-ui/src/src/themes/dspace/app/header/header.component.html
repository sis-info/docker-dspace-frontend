<header id="main-site-header">
  <div class="ast-above-header-wrap" id="gov-site-header-container">
    <div class="ast-above-header-bar ast-above-header  site-header-focus-item"
      data-section="section-above-header-builder">
      <div class="site-above-header-wrap ast-builder-grid-row-container site-header-focus-item ast-container"
        data-section="section-above-header-builder">
        <div class="ast-builder-grid-row ast-builder-grid-row-has-sides ast-builder-grid-row-no-center">
          <div class="site-header-above-section-left site-header-section ast-flex site-header-section-left">
            <aside class="header-widget-area widget-area site-header-focus-item header-widget-area-inner"
              data-section="sidebar-widgets-header-widget-1" aria-label="Header Widget 1" role="region">
              <section id="block-3" class="widget widget_block widget_media_image">
                <figure class="wp-block-image size-large is-resized"><a href="https://www.gov.co/" target="_blank"
                    rel=" noreferrer noopener"><img fetchpriority="high" decoding="async" width="1024" height="221"
                      src="https://www.icanh.gov.co/wp-content/uploads/2025/04/logofinal_gov-1024x221.png" alt=""
                      class="wp-image-52280" style="width:127px;height:auto"
                      srcset="https://www.icanh.gov.co/wp-content/uploads/2025/04/logofinal_gov-1024x221.png 1024w, https://www.icanh.gov.co/wp-content/uploads/2025/04/logofinal_gov-300x65.png 300w, https://www.icanh.gov.co/wp-content/uploads/2025/04/logofinal_gov-768x166.png 768w, https://www.icanh.gov.co/wp-content/uploads/2025/04/logofinal_gov-1536x331.png 1536w, https://www.icanh.gov.co/wp-content/uploads/2025/04/logofinal_gov-2048x442.png 2048w"
                      sizes="(max-width: 1024px) 100vw, 1024px"></a></figure>
              </section>
            </aside>
          </div>
          <div class="site-header-above-section-right site-header-section ast-flex ast-grid-right-section">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="icanh-site-header-container">
    <span><a href="https://www.icanh.gov.co/" rel="home" aria-current="page"><img width="259" height="60"
          src="https://www.icanh.gov.co/wp-content/uploads/2024/07/cropped-Logo-cultura-icanh_copia-259x60.png"
          class="icanh-logo" alt="ICANH Sede electrónica" decoding="async"
          srcset="https://www.icanh.gov.co/wp-content/uploads/2024/07/cropped-Logo-cultura-icanh_copia-259x60.png 259w, https://www.icanh.gov.co/wp-content/uploads/2024/07/cropped-Logo-cultura-icanh_copia-300x69.png 300w, https://www.icanh.gov.co/wp-content/uploads/2024/07/cropped-Logo-cultura-icanh_copia-768x177.png 768w, https://www.icanh.gov.co/wp-content/uploads/2024/07/cropped-Logo-cultura-icanh_copia.png 868w"
          sizes="(max-width: 259px) 100vw, 259px"></a></span>
  </div>

  <div class="container h-100 d-flex flex-row align-items-center justify-content-between gapx-3 gapy-2"
    id="main-site-header-container">
    <!-- Logo and navbar wrapper -->
    <div id="header-left" [attr.role]="(isMobile$ | async) ? 'navigation' : 'presentation'"
      [attr.aria-label]="(isMobile$ | async) ? ('nav.main.description' | translate) : null"
      class="h-100 flex-fill d-flex flex-row flex-nowrap justify-content-start align-items-center gapx-3">
      <nav *ngIf="(isMobile$ | async) !== true"
        class="navbar navbar-expand p-0 align-items-stretch align-self-stretch flex-grow-1 flex-shrink-1"
        id="desktop-navbar" [attr.aria-label]="'nav.main.description' | translate">
        <ds-navbar></ds-navbar>
        <!-- <ds-lang-switch></ds-lang-switch> -->
        <ds-auth-nav-menu style="margin-left: auto;"></ds-auth-nav-menu>

        <div id="mobile-navbar-toggler" class="d-block d-lg-none ml-3" *ngIf="(isMobile$ | async)">
          <button id="navbar-toggler" class="btn" type="button" (click)="toggleNavbar()"
            [attr.aria-label]="'nav.toggle' | translate" aria-controls="collapsible-mobile-navbar"
            [attr.aria-expanded]="(isNavBarCollapsed$ | async) !== true">
            <span class="fas fa-bars fa-fw fa-xl toggler-icon" aria-hidden="true"></span>
          </button>
        </div>
      </nav>
    </div>
  </div>
</header>
